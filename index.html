<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f3f3" />
<title>Money Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=7" />
<link rel="stylesheet" href="money.css?v=10" />
</head>
<body class="money">
  <div class="app">
    <main class="scroller" id="scroller">
      <section class="card" id="card" role="table" aria-label="Transaction ledger"></section>
      <p class="blank" id="blank" hidden>No transactions yet. Tap &minus; to log a spend.</p>
    </main>

    <!-- The plate is a display that happens to be tappable, so it is sunk into
         the bar while the two keys are lifted off it. Money out is the widest
         target and sits hard against the right edge, where the thumb rests. -->
    <nav class="toolbar" aria-label="Ledger controls">
      <button class="plate" id="plate" type="button"
              aria-label="Balance &mdash; open You" aria-live="polite"></button>

      <button class="key k-in" id="btnIn" type="button" aria-label="Money in">
        <svg class="icon" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path d="M9 1.5V16.5M1.5 9H16.5" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" />
        </svg>
      </button>

      <button class="key k-out" id="btnOut" type="button" aria-label="Money out">
        <svg class="icon" viewBox="0 0 18 4" width="18" height="4" aria-hidden="true">
          <path d="M1.5 2H16.5" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" />
        </svg>
      </button>
    </nav>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-actions" id="sheetActions"></div>
      </div>
    </div>
  </div>

  <script src="money.js?v=13"></script>

  <!-- The mascot. It carries its own shapes and its own stylesheet, so there is
       nothing to import but this, and nothing to undo but these three lines. -->
  <script src="mascot.js?v=28"></script>
  <script>Mascot.mount('#plate');</script>
</body>
</html>
